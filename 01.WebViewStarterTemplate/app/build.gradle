plugins {
        id 'com.android.application'
        id 'kotlin-android'
    }

    def signingPropertiesFile = rootProject.file('keystore.properties')
    def signingProperties = new Properties()
    if (signingPropertiesFile.exists()) {
        signingPropertiesFile.withInputStream { signingProperties.load(it) }
    }
    if (!signingPropertiesFile.exists() && gradle.startParameter.taskNames.any {
        it.toLowerCase().contains('release')
    }) {
        throw new GradleException('Missing keystore.properties: release builds must use the official signing key.')
    }

    android {
        namespace 'com.webviewtemplate.webviewtemplate'
        compileSdk 34
        ndkVersion '26.3.11579264'

        defaultConfig {
            applicationId "com.webviewtemplate.webviewtemplate"
            minSdk 24
            targetSdk 34
            versionCode 24
            versionName "1.9.0"
            externalNativeBuild {
                cmake {
                    cppFlags '-std=c++17', '-O2', '-ffast-math', '-DANDROID'
                    arguments '-DANDROID_STL=c++_shared'
                }
            }
        }

        buildTypes {
            release {
                signingConfig signingPropertiesFile.exists()
                    ? signingConfigs.create('releaseOfficial') {
                        storeFile rootProject.file(signingProperties['storeFile'])
                        storePassword signingProperties['storePassword']
                        keyAlias signingProperties['keyAlias']
                        keyPassword signingProperties['keyPassword']
                        enableV1Signing true
                        enableV2Signing true
                        enableV3Signing true
                    }
                    : signingConfigs.debug
                minifyEnabled true
                shrinkResources true
                proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            }
        }

        buildFeatures {
            viewBinding true
            compose true
        }

        compileOptions {
            sourceCompatibility JavaVersion.VERSION_17
            targetCompatibility JavaVersion.VERSION_17
        }
        kotlinOptions {
            jvmTarget = '17'
        }
        composeOptions {
            kotlinCompilerExtensionVersion '1.4.6'
        }
        externalNativeBuild {
            cmake {
                path file('src/main/cpp/CMakeLists.txt')
                version '3.22.1'
            }
        }
        buildFeatures {
            prefab true
        }
    }

    dependencies {
        implementation 'androidx.core:core-ktx:1.12.0'
        implementation platform('androidx.compose:compose-bom:2023.10.01')
        implementation 'androidx.compose.ui:ui'
        implementation 'androidx.compose.ui:ui-tooling-preview'
        implementation 'androidx.compose.material3:material3'
        implementation 'androidx.compose.material:material-icons-extended'
        implementation 'androidx.activity:activity-compose:1.8.2'
        implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
        implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
        implementation 'androidx.webkit:webkit:1.9.0'
        implementation 'com.google.oboe:oboe:1.8.1'
        implementation 'dev.rikka.shizuku:api:13.1.5'
        implementation 'dev.rikka.shizuku:provider:13.1.5'
    }
